# coursework.yml — single source of truth for the /coursework page on simo899t.github.io
#
# Read at build time by src/pages/coursework.astro. Order here = order on the page.
# Each item is one of:
#   pdf:    <path in the simo899t/SDU repo>  -> GitHub PDF view + a 'source' link to the sibling .typ/.tex
#   url:    <any link>                       -> e.g. a code folder or project repo
#   source: <path or URL> alone             -> 'source only' link (PDF not compiled yet)
#   none:   true  (or a string)             -> dimmed "no notes" row, no link, not counted
# Optional per item: description, updated.  Only my own work is listed here.

